name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decrypt keystore
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: openssl enc -d -aes-256-cbc -pbkdf2 -in release.keystore.enc -out release.keystore -pass env:KS_PASS

      - name: Build signed release APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk DarkStatusBar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DarkStatusBar-apk
          path: DarkStatusBar.apk

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DarkStatusBar.apk
          generate_release_notes: true
