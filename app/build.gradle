plugins {
    id 'com.android.application'
}

android {
    namespace 'com.furina.darkstatusbar'
    compileSdk 34

    defaultConfig {
        applicationId 'com.furina.darkstatusbar'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.5'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
